<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英語パターンノート</title>
<meta name="theme-color" content="#f3f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パターン">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<style>
/* Layout: one narrow study column. Home = list of patterns; a pattern opens into 手順 / カード / 並べ替え; English sentences are split into colour-coded parts that recur on every screen. */
:root {
  --bg: #f3f5f2;
  --paper: #ffffff;
  --ink: #1d2a33;
  --muted: #5f6d72;
  --line: #d9e0dc;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --p0: #b4530f; --p0-bg: #fbe9da;
  --p1: #1f6f78; --p1-bg: #dcefef;
  --p2: #6b4ab0; --p2-bg: #ebe4f7;
  --p3: #2f7a3a; --p3-bg: #e0f1e0;
  --p4: #a3366b; --p4-bg: #f8e1ec;
  --ok: #2f7a3a;
  --ng: #b3352b;
  --f-display: "Bitter", Georgia, serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a1d; --paper: #1b2427; --ink: #e5ece9; --muted: #95a3a6; --line: #2c393d;
    --accent: #5fb7bf; --accent-ink: #0d1517;
    --p0: #f0a061; --p0-bg: #3a2717;
    --p1: #6cc4cc; --p1-bg: #173436;
    --p2: #b49af0; --p2-bg: #2c2440;
    --p3: #7fcf88; --p3-bg: #1b3420;
    --p4: #ee8fbd; --p4-bg: #3a1c2b;
    --ok: #7fcf88; --ng: #f08a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a1d; --paper: #1b2427; --ink: #e5ece9; --muted: #95a3a6; --line: #2c393d;
  --accent: #5fb7bf; --accent-ink: #0d1517;
  --p0: #f0a061; --p0-bg: #3a2717;
  --p1: #6cc4cc; --p1-bg: #173436;
  --p2: #b49af0; --p2-bg: #2c2440;
  --p3: #7fcf88; --p3-bg: #1b3420;
  --p4: #ee8fbd; --p4-bg: #3a1c2b;
  --ok: #7fcf88; --ng: #f08a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.7;
  padding: 0 16px;
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.label { font: 500 0.72rem var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
section { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.notice { color: var(--muted); font-size: 0.92rem; }

.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar .spacer { flex: 1; }
.back { font: 700 0.95rem var(--f-body); background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; }

/* list */
.list { display: flex; flex-direction: column; gap: 10px; }
.results { display: flex; flex-direction: column; gap: 10px; }
.search input { font: 1rem var(--f-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; }
.search input:focus { border-color: var(--accent); }
mark.hit { background: var(--p0-bg); color: var(--p0); border-radius: 3px; padding: 0 1px; }
.item { text-align: left; width: 100%; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.item:hover { border-color: var(--accent); }
.item .t { font-weight: 700; font-size: 1.1rem; min-width: 0; }
.item .f { font-family: var(--f-display); font-weight: 700; color: var(--accent); min-width: 0; overflow-wrap: anywhere; }
.item .meta { grid-row: span 2; grid-column: 2; font-size: 0.78rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.item .mini { grid-column: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.item .mini i { display: block; height: 100%; background: var(--accent); }

/* tabs */
nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; }
nav.tabs button { font: 700 0.95rem var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 10px 4px; border-radius: 9px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* part chips */
.sent { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.9; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.slot { padding: 0 8px; border-radius: 6px; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.5; }
.slot small { font: 500 0.62rem var(--f-body); letter-spacing: 0.04em; }
.k0 { color: var(--p0); background: var(--p0-bg); }
.k1 { color: var(--p1); background: var(--p1-bg); }
.k2 { color: var(--p2); background: var(--p2-bg); }
.k3 { color: var(--p3); background: var(--p3-bg); }
.k4 { color: var(--p4); background: var(--p4-bg); }
.q { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; }

/* steps */
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps li { display: grid; grid-template-columns: 2rem 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; padding-top: 0; }
ol.steps li:last-child { padding-bottom: 0; }
.num { font: 800 1.2rem var(--f-display); color: var(--accent); line-height: 1.5; }
ol.steps h3 { margin: 0; font-size: 1rem; }
ol.steps p { margin: 2px 0 0; color: var(--muted); font-size: 0.93rem; white-space: pre-line; }
.tips { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: 0.94rem; }
.formula { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; overflow-wrap: anywhere; }
.exlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.exlist li { display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 8px; }
.exlist li:first-child { border-top: 0; padding-top: 0; }
.exlist .en { font-family: var(--f-display); font-weight: 700; }

/* flashcard */
.progress { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; gap: 8px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.card { min-height: 260px; gap: 14px; cursor: pointer; }
.jp { font-size: 1.35rem; font-weight: 700; line-height: 1.5; }
.hint { font-size: 0.88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.tap { margin-top: auto; text-align: center; color: var(--muted); font-size: 0.85rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font: 700 1rem var(--f-body); padding: 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--ng); }
.btn:disabled { opacity: 0.45; cursor: default; }
.small { font-size: 0.85rem; padding: 8px 12px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .spacer { flex: 1; }

/* builder */
.answer { min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 10px; border: 2px dashed var(--line); border-radius: 12px; }
.answer.ok { border-color: var(--ok); border-style: solid; }
.answer.ng { border-color: var(--ng); border-style: solid; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { font: 700 1.05rem var(--f-display); padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.tile.used { visibility: hidden; }
.answer .tile { background: var(--bg); }
.result { font-weight: 700; min-height: 1.7em; }
.result.ok { color: var(--ok); }
.result.ng { color: var(--ng); }

/* editor */
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-weight: 700; font-size: 0.92rem; }
.field > em { font-style: normal; color: var(--muted); font-size: 0.8rem; }
input[type="text"], textarea { font: 1rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; }
textarea { resize: vertical; min-height: 4.5em; line-height: 1.6; }
.rows { display: flex; flex-direction: column; gap: 10px; }
.erow { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 11px; }
.erow .head { display: flex; justify-content: space-between; align-items: center; }
.x { font: 700 0.8rem var(--f-body); background: none; border: 0; color: var(--ng); cursor: pointer; padding: 4px 6px; }
.status { font-size: 0.88rem; min-height: 1.4em; }
.status.ng { color: var(--ng); }
.status.ok { color: var(--ok); }
.backup summary { cursor: pointer; list-style-position: inside; }
.backup[open] summary { margin-bottom: 4px; }
input[type="file"] { font: 0.9rem var(--f-body); color: var(--ink); max-width: 100%; }

@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap" id="app">
  <section>
    <header>
      <h1>英語パターンノート</h1>
      <p class="sub">苦手な文の型を、手順・カード・並べ替えで確認する</p>
    </header>
    <p class="notice">読み込み中…</p>
  </section>
</div>

<script>
// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const local = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// English is written with " / " between parts: "What / made / you / come to Japan?"
const partsOf = en => String(en || "").split("/").map(s => s.trim()).filter(Boolean);
const plain = en => partsOf(en).join(" ").replace(/\s+([?.!,])/g, "$1");
const wordsOf = en => plain(en).replace(/[?.!]+$/, "").split(/\s+/).filter(Boolean);
const endMark = en => (plain(en).match(/[?.!]+$/) || [""])[0];
function sentHTML(p, en) {
  const parts = partsOf(en);
  const labels = p.parts || [];
  const mark = endMark(en);
  return parts.map((t, i) => {
    const text = i === parts.length - 1 && mark ? t.slice(0, -mark.length).trim() : t;
    const lab = labels[i] ? `<small>${esc(labels[i])}</small>` : "";
    return `<span class="slot k${i % 5}">${esc(text)}${lab}</span>`;
  }).join("") + (mark ? `<span class="q">${esc(mark)}</span>` : "");
}

// ---------- state ----------
let db = null, dbState = "loading";   // loading | ready | none
// cloud = claude.ai keeps the data; local = standalone app: shared patterns come from
// patterns.json on GitHub, the viewer's own additions/edits live in this browser
let mode = "cloud";
let builtIn = [];
const MINE = "pm.mine", HIDDEN = "pm.hidden";
let patterns = [];                    // [{id, ...data}]
let view = { name: "list" };          // list | detail{id,tab} | edit{id|null}
let sample = null;
const knownKey = id => "pm.known." + id;

// ---------- data ----------
(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) return startLocal();
  db.collection("patterns").orderBy("createdAt").onSnapshot(snap => {
    patterns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    dbState = "ready";
    if (view.name !== "edit") render();
  }, () => startLocal());
})();
function mergeLocal() {
  const mine = local.get(MINE, {}), hidden = local.get(HIDDEN, []);
  const map = new Map(builtIn.map(p => [p.id, { ...p, builtin: true }]));
  for (const [id, p] of Object.entries(mine)) map.set(id, { ...p, id, builtin: map.has(id), onlyHere: !map.has(id) });
  patterns = [...map.values()].filter(p => !hidden.includes(p.id)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}
async function startLocal() {
  mode = "local";
  try {
    const r = await fetch("patterns.json", { cache: "no-cache" });
    if (r.ok) { const j = await r.json(); builtIn = Array.isArray(j.patterns) ? j.patterns : []; }
  } catch {}
  mergeLocal();
  dbState = "ready";
  if (view.name !== "edit") render();
}
(async () => {
  try { sample = await window.claude?.use?.("sample"); } catch { sample = null; }
  if (view.name === "edit") { const b = $("aiBox"); if (b) b.hidden = !sample; }
})();

function go(v) { view = v; render(); scrollTo(0, 0); }
const current = () => patterns.find(p => p.id === view.id);

// ---------- render ----------
function render() {
  const app = $("app");
  if (view.name === "detail" && !current()) view = { name: "list" };
  const typing = document.activeElement?.id === "q";
  if (view.name === "list") app.innerHTML = listHTML();
  else if (view.name === "detail") app.innerHTML = detailHTML(current());
  else app.innerHTML = editHTML();
  bind();
  if (typing && $("q")) { const q = $("q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

// search: "な" → patterns whose name (or English template) starts with な; katakana/hiragana and case are treated alike
let query = "";
const norm = t => String(t || "").normalize("NFKC").toLowerCase().replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).trim();
function itemHTML(p, q) {
  const n = (p.examples || []).length;
  const k = Object.keys(local.get(knownKey(p.id), {})).filter(i => i < n).length;
  const t = String(p.title || "");
  const title = q && norm(t).startsWith(q) && norm(t.slice(0, q.length)) === q
    ? `<mark class="hit">${esc(t.slice(0, q.length))}</mark>${esc(t.slice(q.length))}` : esc(t);
  return `<button class="item" data-open="${esc(p.id)}">
      <span class="t">${title}</span>
      <span class="meta">${p.onlyHere ? "この端末だけ<br>" : ""}例文 ${n}<br>覚えた ${k}</span>
      <span class="f">${esc(p.formula)}</span>
      <span class="mini"><i style="width:${n ? k / n * 100 : 0}%"></i></span>
    </button>`;
}
function resultsHTML() {
  const q = norm(query);
  if (!q) return `<div class="list">${patterns.map(p => itemHTML(p, "")).join("")}</div>`;
  const starts = patterns.filter(p => norm(p.title).startsWith(q) || norm(p.formula).startsWith(q));
  const contains = patterns.filter(p => !starts.includes(p) && (norm(p.title).includes(q) || norm(p.formula).includes(q)));
  let h = "";
  h += starts.length
    ? `<div class="label">「${esc(query.trim())}」で始まるパターン ${starts.length}件</div><div class="list">${starts.map(p => itemHTML(p, q)).join("")}</div>`
    : `<p class="notice" style="margin:0">「${esc(query.trim())}」で始まるパターンはありません。</p>`;
  if (contains.length) h += `<div class="label">「${esc(query.trim())}」を含むパターン ${contains.length}件</div><div class="list">${contains.map(p => itemHTML(p, "")).join("")}</div>`;
  return h;
}
function listHTML() {
  let body;
  if (dbState === "loading") body = `<p class="notice">読み込み中…</p>`;
  else if (dbState === "none") body = `<div class="panel"><p class="notice" style="margin:0">保存先に接続できませんでした。claude.ai にサインインした状態でこのページを開くと、パターンの一覧が表示されます。</p></div>`;
  else if (!patterns.length) body = `<div class="panel"><h2>パターンはまだありません</h2><p class="notice" style="margin:0">「＋ 新しいパターン」から、覚えたい文の型を追加してください。</p></div>`;
  else body = `<div class="search"><input type="search" id="q" value="${esc(query)}" placeholder="パターンを検索（例：な、どこ、Why）" aria-label="パターンを検索" autocomplete="off"></div>
    <div class="results" id="results" aria-live="polite">${resultsHTML()}</div>`;
  return `<section>
    <header>
      <h1>英語パターンノート</h1>
      <p class="sub">苦手な文の型を、手順・カード・並べ替えで確認する</p>
    </header>
    ${body}
    <button class="btn primary" id="newBtn" ${dbState === "ready" ? "" : "disabled"}>＋ 新しいパターン</button>
    ${mode === "local" && dbState === "ready" ? backupHTML() : ""}
  </section>`;
}

function detailHTML(p) {
  const tab = view.tab || "learn";
  const ex0 = (p.examples || [])[0];
  const steps = (p.steps || []).filter(s => s.h || s.b);
  const tips = (p.tips || []).filter(Boolean);
  const learn = `
    ${ex0 ? `<div class="panel"><div class="label">完成形</div><div class="sent">${sentHTML(p, ex0.en)}</div><div>${esc(ex0.jp)}</div></div>` : ""}
    ${steps.length ? `<div class="panel"><div class="label">手順</div><ol class="steps">${steps.map((s, i) => `<li><span class="num">${i + 1}</span><div><h3>${esc(s.h)}</h3>${s.b ? `<p>${esc(s.b)}</p>` : ""}</div></li>`).join("")}</ol></div>` : ""}
    <div class="panel">
      <div class="label">テンプレート</div>
      <div class="formula">${esc(p.formula)}</div>
      ${p.meaning ? `<div>${esc(p.meaning)}</div>` : ""}
      ${tips.length ? `<ul class="tips">${tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    </div>
    ${(p.examples || []).length ? `<div class="panel"><div class="label">例文</div><ul class="exlist">${p.examples.map(e => `<li><span>${esc(e.jp)}</span><span class="en">${esc(plain(e.en))}</span></li>`).join("")}</ul></div>` : ""}`;
  const noEx = `<div class="panel"><p class="notice" style="margin:0">例文がまだありません。「編集」から例文を追加すると練習できます。</p></div>`;
  const card = `
    <div class="toolbar">
      <button class="btn small" id="dir"></button>
      <span class="spacer"></span>
      <button class="btn small" id="onlyNg"></button>
      <button class="btn small" id="reset">記録をリセット</button>
    </div>
    <div><div class="progress"><span id="pText"></span><span id="pKnown"></span></div><div class="bar"><i id="pBar"></i></div></div>
    <div class="panel card" id="cardBox" tabindex="0" role="button" aria-label="タップで答えを表示">
      <div class="label" id="cFront"></div>
      <div class="jp" id="cQ"></div>
      <div id="cA" hidden><div class="sent" id="cSent"></div><div class="hint" id="cHint"></div></div>
      <div class="tap" id="cTap">タップして答えを見る</div>
    </div>
    <div class="row"><button class="btn" id="again">もう一度</button><button class="btn primary" id="known">覚えた</button></div>`;
  const build = `
    <div class="panel">
      <div class="label">日本語に合う英語を作る</div>
      <div class="jp" id="bQ"></div>
      <div class="answer" id="bAns" aria-label="あなたの答え"></div>
      <div class="bank" id="bBank"></div>

  return `<section>
    <div class="topbar"><button class="back" data-home>← 一覧</button><span class="spacer"></span><button class="btn small" data-edit="${esc(p.id)}">編集</button></div>

}

// ---------- wiring ----------
function bindOpen() {
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => go({ name: "detail", id: b.dataset.open, tab: local.get("pm.tab", "learn") }));
}
function bind() {
  bindOpen();
  document.querySelectorAll("[data-home]").forEach(b => b.onclick = () => go({ name: "list" }));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => go({ name: "edit", id: b.dataset.edit }));
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { view.tab = b.dataset.tab; local.set("pm.tab", view.tab); render(); });
  if ($("q")) $("q").oninput = e => { query = e.target.value; $("results").innerHTML = resultsHTML(); bindOpen(); };
  bindBackup();
  if ($("newBtn")) $("newBtn").onclick = () => go({ name: "edit", id: null });
  if (view.name === "detail") {
    if (view.tab === "card" && $("cardBox")) startCards();
    if (view.tab === "build" && $("bBank")) nextBuild();
  }
  if (view.name === "edit") bindEdit();
}

// ---------- cards ----------
let cs = null;
function startCards() {
  const p = current();
  cs = { p, known: local.get(knownKey(p.id), {}), enFirst: local.get("pm.enFirst", false), onlyNg: false, order: [], pos: 0, revealed: false };
  buildOrder(); renderCard();
  $("cardBox").onclick = reveal;
  $("cardBox").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); } };
  $("known").onclick = () => { if (!cs.revealed) return reveal(); cs.known[cs.order[cs.pos]] = true; local.set(knownKey(cs.p.id), cs.known); nextCard(); };
  $("again").onclick = () => { if (!cs.revealed) return reveal(); delete cs.known[cs.order[cs.pos]]; local.set(knownKey(cs.p.id), cs.known); nextCard(); };
  $("dir").onclick = () => { cs.enFirst = !cs.enFirst; local.set("pm.enFirst", cs.enFirst); renderCard(); };
  $("onlyNg").onclick = () => { cs.onlyNg = !cs.onlyNg; buildOrder(); renderCard(); };
  $("reset").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.armed) { cs.known = {}; local.set(knownKey(cs.p.id), {}); delete b.dataset.armed; b.textContent = "記録をリセット"; buildOrder(); renderCard(); }
    else { b.dataset.armed = "1"; b.textContent = "本当にリセット？"; setTimeout(() => { delete b.dataset.armed; b.textContent = "記録をリセット"; }, 3000); }
  };
}
function buildOrder() {
  const all = cs.p.examples.map((_, i) => i);
  const idx = all.filter(i => !cs.onlyNg || !cs.known[i]);
  cs.order = shuffle(idx.length ? idx : all); cs.pos = 0;
}
function renderCard() {
  const ex = cs.p.examples;
  const n = Object.keys(cs.known).filter(i => i < ex.length).length;
  $("pText").textContent = `${cs.pos + 1} / ${cs.order.length} 枚目`;
  $("pKnown").textContent = `覚えた ${n} / ${ex.length}`;
  $("pBar").style.width = (n / ex.length * 100) + "%";
  $("dir").textContent = cs.enFirst ? "英語 → 日本語" : "日本語 → 英語";
  $("onlyNg").textContent = cs.onlyNg ? "全部の問題" : "まだの問題だけ";
  const it = ex[cs.order[cs.pos]];
  cs.revealed = false; $("cA").hidden = true; $("cTap").hidden = false;
  if (cs.enFirst) {
    $("cFront").textContent = "英語";
    $("cQ").innerHTML = `<span class="q">${esc(plain(it.en))}</span>`;
    $("cSent").innerHTML = `<span class="jp">${esc(it.jp)}</span>`;
  } else {
    $("cFront").textContent = "日本語";
    $("cQ").textContent = it.jp;
    $("cSent").innerHTML = sentHTML(cs.p, it.en);
  }
  $("cHint").textContent = it.hint ? "ポイント：" + it.hint : "";
  $("cHint").hidden = !it.hint;
}
function reveal() { if (cs.revealed) return; cs.revealed = true; $("cA").hidden = false; $("cTap").hidden = true; }
function nextCard() { cs.pos++; if (cs.pos >= cs.order.length) buildOrder(); renderCard(); }

// ---------- builder ----------
let bs = null;
function nextBuild() {
  const p = current();
  const it = p.examples[Math.floor(Math.random() * p.examples.length)];
  const words = wordsOf(it.en);
  const decoys = shuffle((p.decoys || []).filter(w => w && !words.includes(w))).slice(0, 2);
  bs = { it, words, picked: [] };
  $("bQ").textContent = it.jp;
  const bank = $("bBank"); bank.innerHTML = "";
  shuffle([...words, ...decoys]).forEach(w => {
    const b = document.createElement("button");
    b.className = "tile"; b.textContent = w;
    b.onclick = () => { if (b.classList.contains("used")) return; b.classList.add("used"); bs.picked.push({ w, el: b }); renderAns(); };
    bank.appendChild(b);
  });
  $("bClear").onclick = () => { bs.picked.forEach(x => x.el.classList.remove("used")); bs.picked = []; renderAns(); };
  $("bNext").onclick = nextBuild;
  renderAns();
}
function renderAns() {
  const ans = $("bAns"); ans.innerHTML = ""; ans.className = "answer";
  $("bRes").textContent = ""; $("bRes").className = "result";
  bs.picked.forEach((x, i) => {
    const b = document.createElement("button");
    b.className = "tile"; b.textContent = x.w;
    b.onclick = () => { x.el.classList.remove("used"); bs.picked.splice(i, 1); renderAns(); };
    ans.appendChild(b);
  });
  if (bs.picked.length === bs.words.length) {
    const ok = bs.picked.map(x => x.w).join(" ") === bs.words.join(" ");
    ans.classList.add(ok ? "ok" : "ng");
    $("bRes").className = "result " + (ok ? "ok" : "ng");
    $("bRes").textContent = (ok ? "正解！ " : "おしい　正解：") + plain(bs.it.en) + (!ok && bs.it.hint ? `（${bs.it.hint}）` : "");
  }
}

// ---------- editor ----------
function readForm() {
  const d = view.draft;
  d.title = $("fTitle").value.trim();
  d.formula = $("fFormula").value.trim();
  d.meaning = $("fMeaning").value.trim();
  d.parts = $("fParts").value.split(/[、,，]/).map(s => s.trim()).filter(Boolean);
  d.tips = $("fTips").value.split("\n").map(s => s.trim()).filter(Boolean);
  d.decoys = $("fDecoys").value.split(/\s+/).filter(Boolean);
  d.steps = d.steps.map((_, i) => ({ h: document.querySelector(`[data-step-h="${i}"]`).value.trim(), b: document.querySelector(`[data-step-b="${i}"]`).value.trim() }));
  d.examples = d.examples.map((_, i) => ({ jp: document.querySelector(`[data-ex-jp="${i}"]`).value.trim(), en: document.querySelector(`[data-ex-en="${i}"]`).value.trim(), hint: document.querySelector(`[data-ex-hint="${i}"]`).value.trim() }));
}
function rerenderEdit() { const y = scrollY; $("app").innerHTML = editHTML(); bind(); scrollTo(0, y); }
function bindEdit() {
  const leave = () => { const id = view.id; go(id ? { name: "detail", id, tab: "learn" } : { name: "list" }); };
  $("cancelEdit").onclick = leave;
  if ($("cancelEdit2")) $("cancelEdit2").onclick = leave;
  $("addStep").onclick = () => { readForm(); view.draft.steps.push({ h: "", b: "" }); rerenderEdit(); };
  $("addEx").onclick = () => { readForm(); view.draft.examples.push({ jp: "", en: "", hint: "" }); rerenderEdit(); };
  document.querySelectorAll("[data-del-step]").forEach(b => b.onclick = () => { readForm(); view.draft.steps.splice(+b.dataset.delStep, 1); rerenderEdit(); });
  document.querySelectorAll("[data-del-ex]").forEach(b => b.onclick = () => { readForm(); view.draft.examples.splice(+b.dataset.delEx, 1); rerenderEdit(); });
  $("saveBtn").onclick = save;
  if ($("delBtn")) $("delBtn").onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "もう一度押すと削除"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "このパターンを削除"; } }, 3000); return; }
    remove();
  };
  if ($("aiRun")) $("aiRun").onclick = autofill;
}
async function save() {
  readForm();
  const d = view.draft;
  const st = $("saveStatus");
  if (!d.title || !d.formula) { st.className = "status ng"; st.textContent = "パターン名と英語の型を入力してください。"; return; }
  const body = {
    title: d.title, formula: d.formula, meaning: d.meaning, parts: d.parts, tips: d.tips, decoys: d.decoys,
    steps: d.steps.filter(s => s.h || s.b),
    examples: d.examples.filter(e => e.jp && e.en),
    createdAt: d.createdAt || Date.now(), updatedAt: Date.now()
  };
  $("saveBtn").disabled = true; st.className = "status"; st.textContent = "保存中…";
  if (mode === "local") {
    const id = view.id || "my-" + Date.now().toString(36);
    const mine = local.get(MINE, {});
    mine[id] = body;
    local.set(MINE, mine);
    if (JSON.stringify(local.get(MINE, {})[id]) !== JSON.stringify(body)) {
      $("saveBtn").disabled = false; st.className = "status ng";
      st.textContent = "この端末に保存できませんでした。プライベートブラウズを使っていないか確認してください。";
      return;
    }
    local.set(HIDDEN, local.get(HIDDEN, []).filter(x => x !== id));
    mergeLocal();
    return go({ name: "detail", id, tab: "learn" });
  }
  try {
    const ref = view.id ? db.collection("patterns").doc(view.id) : db.collection("patterns").doc();
    await ref.set(body);
    go({ name: "detail", id: ref.id, tab: "learn" });
  } catch (e) {
    $("saveBtn").disabled = false; st.className = "status ng";
    st.textContent = e?.code === "quota_exceeded" ? "保存できる量の上限に達しました。使わないパターンを削除してください。" : e?.code === "invalid_argument" ? "このページを編集する権限がないため保存できません。" : "保存できませんでした。もう一度「保存する」を押してください。";
  }
}
async function remove() {
  if (mode === "local") {
    const mine = local.get(MINE, {});
    delete mine[view.id];
    local.set(MINE, mine);
    if (builtIn.some(p => p.id === view.id)) local.set(HIDDEN, [...new Set([...local.get(HIDDEN, []), view.id])]);
    local.set(knownKey(view.id), {});
    mergeLocal();
    return go({ name: "list" });
  }
  try { await db.collection("patterns").doc(view.id).delete(); local.set(knownKey(view.id), {}); go({ name: "list" }); }
  catch { $("saveStatus").className = "status ng"; $("saveStatus").textContent = "削除できませんでした。もう一度試してください。"; }
}
// ---------- backup (standalone app) ----------
function backupData() {
  const known = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("pm.known.")) known[k.slice(9)] = local.get(k, {}); } } catch {}
  return { app: "pattern-note", version: 1, exportedAt: new Date().toISOString(), mine: local.get(MINE, {}), hidden: local.get(HIDDEN, []), known };
}
function backupHTML() {
  const mineCount = Object.keys(local.get(MINE, {})).length;
  return `<details class="panel backup">
    <summary><b>バックアップ</b>　<span class="notice">この端末で追加・変更したパターン ${mineCount}件</span></summary>
    <p class="notice" style="margin:0">自分で追加したパターンと「覚えた」の記録は、この端末だけに保存されています。別の端末に移すときや、消えたときに戻すときに使います。</p>
    <div class="row">
      <button class="btn small" id="bkSave">ファイルに保存</button>
      <button class="btn small" id="bkCopy">テキストをコピー</button>
    </div>
    <label class="field"><span>バックアップから戻す</span><em>保存したファイルを選ぶか、コピーしたテキストを貼り付けます。</em>
      <input type="file" id="bkFile" accept="application/json,.json,text/plain"></label>
    <textarea id="bkText" rows="3" placeholder="コピーしたバックアップのテキストを貼り付け" aria-label="バックアップのテキスト"></textarea>
    <button class="btn small" id="bkLoad">貼り付けたテキストから戻す</button>
    <div class="status" id="bkStatus" aria-live="polite"></div>
  </details>`;
}
function restore(text) {
  const st = $("bkStatus");
  let d;
  try { d = JSON.parse(text); } catch { d = null; }
  if (!d || d.app !== "pattern-note" || typeof d.mine !== "object") { st.className = "status ng"; st.textContent = "バックアップとして読み込めませんでした。保存したファイルか、コピーしたテキストをそのまま使ってください。"; return; }
  local.set(MINE, { ...local.get(MINE, {}), ...d.mine });
  local.set(HIDDEN, [...new Set([...local.get(HIDDEN, []), ...(Array.isArray(d.hidden) ? d.hidden : [])])]);
  for (const [id, k] of Object.entries(d.known || {})) local.set(knownKey(id), { ...local.get(knownKey(id), {}), ...k });
  mergeLocal(); render();
  const s2 = $("bkStatus"); if (s2) { s2.closest("details").open = true; s2.className = "status ok"; s2.textContent = `パターン ${Object.keys(d.mine).length}件を戻しました。`; }
}
function bindBackup() {
  if (!$("bkSave")) return;
  $("bkSave").onclick = () => {
    const blob = new Blob([JSON.stringify(backupData(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "pattern-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $("bkStatus").className = "status ok"; $("bkStatus").textContent = "バックアップのファイルを保存しました。";
  };
  $("bkCopy").onclick = () => {
    const text = JSON.stringify(backupData());
    const done = () => { $("bkStatus").className = "status ok"; $("bkStatus").textContent = "コピーしました。メモなどに貼り付けて保管してください。"; };
    const fallback = () => { $("bkText").value = text; $("bkText").select(); $("bkStatus").className = "status"; $("bkStatus").textContent = "下の欄のテキストをコピーしてください。"; };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  };
  $("bkFile").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(restore); };
  $("bkLoad").onclick = () => restore($("bkText").value.trim());
}

async function autofill() {
  const text = $("aiText").value.trim();
  const st = $("aiStatus");
  if (!text) { st.className = "status ng"; st.textContent = "メモを貼り付けてから押してください。"; return; }
  $("aiRun").disabled = true; st.className = "status"; st.textContent = "読み取り中…";
  const prompt = `You help a Japanese learner of English. Turn the study note below into one sentence pattern.
Reply with only a JSON object with these fields (all text in Japanese except English sentences):
{"title": "the Japanese question form, e.g. どうして〜したの？",
 "formula": "the English template, e.g. What made S V(原形)?",
 "meaning": "short Japanese meaning of the template",
 "parts": ["Japanese label for each part of the English sentence, in order, e.g. 原因","make","誰が","何を（原形）"],
 "steps": [{"h": "step heading", "b": "explanation, may include an example"}],
 "tips": ["common mistakes or notes, one per item"],
 "examples": [{"jp": "Japanese sentence", "en": "English sentence with ' / ' between the parts listed in parts, e.g. What / made / you / come to Japan?", "hint": "short Japanese point"}],
 "decoys": ["2-4 single English words a learner might wrongly add, e.g. to, why"]}
Keep every example from the note. If the note has fewer than 6 examples, add natural ones until there are 6 to 8. English must be correct and natural.

Note:
${text}`;
  try {
    const r = await sample.json(prompt, { modelTier: "default" });
    if (!r || typeof r !== "object" || !r.title) throw { code: "invalid_json" };
    const arr = v => Array.isArray(v) ? v : [];
    view.draft = {
      ...view.draft,
      title: String(r.title || ""), formula: String(r.formula || ""), meaning: String(r.meaning || ""),
      parts: arr(r.parts).map(String), tips: arr(r.tips).map(String), decoys: arr(r.decoys).map(String),
      steps: arr(r.steps).map(s => ({ h: String(s?.h || ""), b: String(s?.b || "") })),
      examples: arr(r.examples).map(e => ({ jp: String(e?.jp || ""), en: String(e?.en || ""), hint: String(e?.hint || "") }))
    };
    if (!view.draft.steps.length) view.draft.steps = [{ h: "", b: "" }];
    if (!view.draft.examples.length) view.draft.examples = [{ jp: "", en: "", hint: "" }];
    rerenderEdit();
    const s2 = $("aiStatus"); s2.className = "status ok"; s2.textContent = "入力しました。内容を確認して「保存する」を押してください。";
    $("aiText").value = text;
  } catch (e) {
    $("aiRun").disabled = false; st.className = "status ng";
    st.textContent = e?.code === "not_granted" ? "自動入力が許可されていません。項目を手で入力してください。" : e?.code === "rate_limited" ? "少し時間をおいてからもう一度押してください。" : "うまく読み取れませんでした。メモを短くするか、項目を手で入力してください。";
  }
}

render();
</script>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
