    <ellipse cx="512" cy="748.8" rx="294.0" ry="100.8" fill="#021b20" opacity="0.55" filter="url(#soft)"/>

    <!-- case side (gives the thickness) -->
    <path d="M 212 470 L 212 528 A 300 240.0 0 0 0 812 528 L 812 470 Z" fill="url(#side)"/>
